name: Wave
description: >-
  Wave is a virtual entertainment company that produces interactive, avatar-driven
  virtual concerts and immersive live music experiences known as "Waves." The platform
  streams stylized, real-time performances from major recording artists — including The
  Weeknd, Justin Bieber, John Legend, J Balvin, and Alison Wonderland — as animated
  avatars across VR headsets, desktop, mobile, and social video platforms, letting fans
  attend and interact with shows from anywhere. Wave is a consumer-facing entertainment
  and media product (accessed at wavexr.com) rather than a developer platform; as of this
  profile it publishes no public API, developer portal, SDKs, or technical documentation.
  It was surfaced as a venture-portfolio company and added to the API Evangelist network,
  where this profile captures its public identity and domain-security posture.
